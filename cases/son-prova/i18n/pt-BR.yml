messages:
  case.title: "Ensaio Final"
  case.synopsis: "O diretor Orhan Demir morre ao cair por um alçapão aberto do palco durante o ensaio. Relatos contraditórios, registros digitais voláteis e uma ação policial apressada deixam pouco tempo para reconstruir quem preparou a queda."
  opening.call: "Orhan Demir morreu depois de cair pelo alçapão do palco durante o ensaio. A polícia pretende deter o contrarregra Baran após cinquenta e cinco minutos de investigação, e o espaço de trabalho de produção de Orhan está na fila para ser apagado. A atriz principal, Leyla, e a produtora, Selin, ainda estão no teatro; Selin pretende sair dentro de uma hora. Posso liberar o relatório da cena e a exportação da automação; escolha o que solicitar e quem interrogar antes que os registros e as testemunhas desapareçam."
