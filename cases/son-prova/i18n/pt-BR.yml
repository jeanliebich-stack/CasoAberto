  affordances.present_audit_to_selin.label: "Confrontar Selin com o rascunho da auditoria de Orhan — arriscado"
  affordances.accuse_baran.label: "Registrar Baran como suspeito — arriscado"
  affordances.accuse_leyla.label: "Registrar Leyla como suspeita — arriscado"
  affordances.deduce_death_not_accident.label: "Verificar se a falha do alçapão foi proposital"
  affordances.deduce_baran_not_operator.label: "Verificar se Baran poderia ter dado o comando"
  affordances.deduce_selin_alibi_false.label: "Verificar se a transmissão ao vivo de Selin foi pré-gravada"
  affordances.deduce_selin_prepared_murder.label: "Reconstituir quem preparou e acionou a armadilha"
  affordances.deduce_selin_financial_motive.label: "Verificar quem se beneficiou das descobertas financeiras de Orhan"
  affordances.deduce_selin_killed_orhan.label: "Reunir as evidências em uma teoria sobre o culpado"
  affordances.deduce_death_not_accident.result: "O pino de segurança não quebrou; foi removido de propósito. Depois, um comando de abertura foi enviado ao alçapão. A morte de Orhan não foi um acidente."
  affordances.deduce_baran_not_operator.result: "Baran estava no café quando o comando foi enviado. Ele partiu do tablet PROD-TAB-03, nos bastidores; Baran não abriu o alçapão."
  affordances.deduce_selin_alibi_false.result: "A transmissão “ao vivo” de Selin foi gravada às 20:24, enviada às 20:31 e programada para ir ao ar das 21:05 às 21:17. O álibi da transmissão ao vivo era falso."
  affordances.deduce_selin_prepared_murder.result: "Selin orientou Orhan a ficar sobre a marca X, em cima do alçapão. Os registros dos bastidores e do tablet mostram que ela preparou e acionou a armadilha."
  affordances.deduce_selin_financial_motive.result: "Os registros financeiros identificam Selin como quem se beneficiou das descobertas de Orhan. Ela tinha motivo financeiro para silenciá-lo."
  affordances.deduce_selin_killed_orhan.result: "As evidências levam a uma única conclusão: Selin preparou a armadilha do alçapão, criou um álibi falso com a transmissão e matou Orhan."
  affordances.conclude_selin.label: "Acusar Selin como autora"
  affordances.conclude_baran.label: "Acusar Baran como autor"
  affordances.conclude_leyla.label: "Acusar Leyla como autora"
  affordances.request_scene_report.result: "Ekin enviou o relatório da cena e uma foto do pino de segurança removido para Arquivos."
  affordances.request_automation_export.result: "A exportação da automação do palco está pronta para análise em Arquivos."
  affordances.request_victim_phone.result: "A extração do celular de Orhan está pronta. Agora é possível analisar as mensagens."
  affordances.locate_baran_contact.result: "O registro no diretório de funcionários foi confirmado. Baran Kılıç foi adicionado aos Contatos."
  affordances.interview_baran_location.result: "Baran diz que estava no café do outro lado da rua quando o alçapão abriu."
  affordances.request_baran_custody_packet.result: "Ekin conseguiu o dossiê de detenção policial. Ele inclui a gravação do café que os policiais usaram para confirmar onde Baran estava."
  affordances.locate_selin_contact.result: "O contato de produção foi confirmado. Selin Aksoy foi adicionada aos Contatos."
  affordances.interview_selin_alibi.result: "Selin diz que estava ao vivo no ar das 21:05 às 21:17."
  affordances.request_livestream_archive.result: "O arquivo da transmissão de Selin está pronto para análise."
  affordances.locate_leyla_contact.result: "O contato de produção foi confirmado. Leyla Aras foi adicionada aos Contatos."
  affordances.interview_leyla.result: "Leyla admite ter discutido com Orhan, mas diz que ficou no lado esquerdo do palco durante a queda."
  affordances.request_security_export.result: "Os registros de saída do teatro e de acesso aos bastidores estão prontos para análise."
  affordances.search_remote_pairing.result: "Foi encontrado um e-mail de suporte sobre o controle remoto do palco."
  affordances.search_livestream_history.result: "Foi encontrado o histórico de publicação da entrevista de Selin."
  affordances.search_production_audit.result: "A auditoria financeira inacabada de Orhan foi encontrada no espaço de trabalho dele."
  affordances.present_cafe_to_baran.result: "Baran admite que deixou a sessão do console aberta. Ele também entrega um e-mail de suporte antigo."
  affordances.present_pin_to_leyla.result: "Leyla dá um relato mais completo de onde estava. Agora há um registro de acesso do lado esquerdo do palco disponível."
  affordances.preserve_workspace.result: "Foi criado um backup protegido do espaço de trabalho de Orhan. A exclusão agendada foi cancelada."
  affordances.preserve_workspace.confirmation: "Preservar o espaço de trabalho agora? Isso cria um backup fixo e cancela o cronômetro de exclusão."
  affordances.present_audit_to_selin.result: "Selin reage imediatamente. A atividade no espaço de trabalho mostra que a exclusão foi antecipada."
  affordances.present_audit_to_selin.confirmation: "Confrontar Selin agora? Isso pode alertá-la e acelerar a perda de registros ou a saída dela."
  affordances.accuse_baran.confirmation: "Registrar Baran como suspeito? Uma acusação falsa vai abalar a confiança dele e pode fechar um caminho de evidências."
  affordances.accuse_leyla.confirmation: "Registrar Leyla como suspeita? Uma acusação falsa vai abalar a confiança dela e pode fechar um caminho de evidências."
  affordances.conclude_selin.confirmation: "Apontar Selin como responsável e encerrar o caso? Isso termina o caso. O relatório final avalia separadamente a sua conclusão e o respaldo de evidências dela."
  affordances.conclude_baran.confirmation: "Apontar Baran como responsável e encerrar o caso? Isso termina o caso. O relatório final avalia separadamente a sua conclusão e o respaldo de evidências dela."
  affordances.conclude_leyla.confirmation: "Apontar Leyla como responsável e encerrar o caso? Isso termina o caso. O relatório final avalia separadamente a sua conclusão e o respaldo de evidências dela."
