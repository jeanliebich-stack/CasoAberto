  affordances.accuse_mert.confirmation: "Registrar Mert como suspeito? Ele pode se recusar a responder a novas perguntas, e uma acusação falsa continuará fazendo parte do caso."
  affordances.apologize_mert.result: "Mert aceita o pedido de desculpas e aceita voltar a conversar, embora parte da confiança tenha se perdido."
