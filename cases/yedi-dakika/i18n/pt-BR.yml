  affordances.deduce_camera_time.result: "A câmera estava sete minutos adiantada. O horário real da saída de Mert foi 20:57."
  affordances.deduce_mert_no_opportunity.result: "Mert saiu do prédio às 20:57; a impressão da pasta vermelha terminou às 20:59:06. Ele não teve oportunidade de pegá-la."
  affordances.deduce_nihan_took_file.result: "Nihan entrou no quarto andar segundos antes de a pasta ser retirada. Os registros de acesso e de câmera confirmam que foi ela quem pegou a pasta vermelha."
  affordances.deduce_nihan_protected_source.result: "O rascunho expunha a fonte confidencial, e Nihan já havia pedido que essa informação fosse removida. Ela pegou a pasta para proteger a fonte."
  affordances.deduce_file_in_b17.result: "A caixa citada na confissão de Nihan corresponde à caixa do quarto andar na rota do prédio. A pasta vermelha está na caixa B-17."
  affordances.deduce_full_explanation.result: "Mert saiu antes de a pasta ser impressa. Nihan a pegou para proteger a fonte confidencial e a colocou na caixa B-17."
  affordances.interview_leyla.result: "Leyla diz que Mert discutiu por causa do pagamento que não recebeu e saiu perto da hora em que a pasta desapareceu."
  affordances.interview_nihan.result: "Nihan nega ter pegado a pasta e não dá um motivo claro para estar no quarto andar."
  affordances.interview_mert_location.result: "Mert diz que saiu às 20:57 e pagou no Karaköy Coffee minutos depois. Ele envia o recibo."
