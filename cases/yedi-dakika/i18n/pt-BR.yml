  affordances.search_building_route.result: "Foi encontrada a rota no prédio da caixa azul confidencial do quarto andar."
  affordances.present_draft_to_nihan.result: "Nihan admite ter pegado a pasta para proteger a fonte exposta e diz que a colocou na caixa B-17."
  affordances.recover_box_b11.confirmation: "Enviar a ordem de recuperação da B-11 e encerrar o caso? Se o número da caixa estiver errado, a pasta verdadeira será destruída."
