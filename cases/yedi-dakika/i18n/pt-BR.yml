messages:
  case.title: "Sete Minutos"
  case.synopsis: "A pasta vermelha de uma entrevista desaparece de uma redação. A gravação do saguão indica, a princípio, um visitante saindo depois de uma discussão, mas o vídeo, a impressora e os registros do prédio divergem quanto ao horário. A pasta está entre as caixas confidenciais que serão recolhidas às 21:45."
  opening.call: "A pasta vermelha sumiu. Discuti sobre pagamento com um visitante durante o turno da noite, e ele foi embora; a câmera do saguão mostra a saída dele, mas ainda não exportei nenhum registro. A coordenadora de publicação, Nihan, também continua na redação. A pasta contém a única cópia limpa de uma entrevista inédita. As caixas azuis confidenciais serão recolhidas às 21:45 e levadas direto para a trituradora. Tenho acesso aos sistemas da redação; diga qual registro você quer primeiro."
